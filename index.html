<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Merchant's Ledger</title>

  <!-- Favicon (browser tab icon) -->
  <link rel="icon" type="image/png" href="merchant_ledger_image.png">
  <link rel="shortcut icon" href="merchant_ledger_image.png">

  <!-- iOS: icon when saved to home screen -->
  <link rel="apple-touch-icon" href="merchant_ledger_image.png">

  <!-- Android / PWA: icon when saved to home screen -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#14100c">

  <!-- App-like fullscreen on iOS when launched from home screen -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Merchant's Ledger">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Cinzel+Decorative:wght@700&family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">

<style>
*{box-sizing:border-box;margin:0;padding:0;}
:root{
  --bg:#14100c;--bg2:#1a1510;--panel:#211a14;--panel2:#2a2119;--panel3:#33291f;
  --line:rgba(201,168,76,0.16);--line2:rgba(201,168,76,0.34);
  --ink:#efe6d4;--muted:#ab9b7d;--faint:#75664f;
  --gold:#c9a84c;--gold-l:#e6cc85;--gold-d:#7a6330;
  --sell:#e0783a;--sell-l:#f4a46c;--sell-d:#8a4318;
  --accent:var(--gold);--accent-l:var(--gold-l);--accent-d:var(--gold-d);
  --accent-soft:rgba(201,168,76,0.10);--accent-mid:rgba(201,168,76,0.22);
  --r:10px;--hh:72px;
  --serif:'EB Garamond',Georgia,serif;--display:'Cinzel',Georgia,serif;
}
body[data-mode="sell"]{
  --accent:var(--sell);--accent-l:var(--sell-l);--accent-d:var(--sell-d);
  --accent-soft:rgba(224,120,58,0.10);--accent-mid:rgba(224,120,58,0.22);
}
html,body{height:100%;}
body{
  background:var(--bg);
  background-image:radial-gradient(ellipse at 20% -10%,rgba(201,168,76,0.07),transparent 55%),radial-gradient(ellipse at 110% 110%,rgba(139,26,26,0.07),transparent 50%);
  font-family:var(--serif);color:var(--ink);font-size:16px;line-height:1.45;
  display:flex;flex-direction:column;-webkit-font-smoothing:antialiased;
}
button,input{font:inherit;color:inherit;}
button{cursor:pointer;-webkit-tap-highlight-color:transparent;}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}
::-webkit-scrollbar{width:6px;height:6px;}
::-webkit-scrollbar-thumb{background:var(--gold-d);border-radius:3px;}
::-webkit-scrollbar-track{background:transparent;}

/* ── Top bar ───────────────────────────────── */
.topbar{
  position:sticky;top:0;z-index:40;display:flex;align-items:center;gap:20px;
  padding:12px 24px;padding-top:max(12px,env(safe-area-inset-top));
  background:linear-gradient(180deg,#1e1813,#16110d);border-bottom:1px solid var(--line2);
}
.topbar::after{content:'';position:absolute;left:0;right:0;bottom:-1px;height:1px;background:linear-gradient(90deg,transparent,var(--accent),transparent);opacity:.6;transition:background .3s;}
.brand{display:flex;align-items:center;gap:12px;min-width:0;}
.brand-mark{width:40px;height:40px;border-radius:8px;border:1px solid var(--line2);object-fit:cover;flex-shrink:0;}
.brand h1{font-family:'Cinzel Decorative',var(--display);font-size:21px;font-weight:700;color:var(--gold-l);letter-spacing:.05em;line-height:1.1;white-space:nowrap;}
.brand p{font-size:13px;color:var(--muted);font-style:italic;}

.mode-toggle{
  position:relative;display:grid;grid-template-columns:1fr 1fr;margin:0 auto;
  background:#0f0b08;border:1px solid var(--line2);border-radius:14px;padding:4px;width:min(460px,100%);
}
.mode-toggle::before{
  content:'';position:absolute;top:4px;bottom:4px;left:4px;width:calc(50% - 4px);border-radius:10px;
  background:linear-gradient(180deg,rgba(201,168,76,0.30),rgba(201,168,76,0.10));
  border:1px solid var(--gold);box-shadow:0 0 18px rgba(201,168,76,0.18);
  transition:transform .28s cubic-bezier(.4,.1,.2,1),background .28s,border-color .28s,box-shadow .28s;
}
body[data-mode="sell"] .mode-toggle::before{
  transform:translateX(100%);
  background:linear-gradient(180deg,rgba(224,120,58,0.30),rgba(224,120,58,0.10));
  border-color:var(--sell);box-shadow:0 0 18px rgba(224,120,58,0.18);
}
.mode-btn{
  position:relative;z-index:1;display:flex;align-items:center;gap:10px;padding:9px 14px;
  background:none;border:0;border-radius:10px;color:var(--faint);text-align:left;transition:color .2s;
}
.mode-btn:hover{color:var(--muted);}
.mode-btn[aria-pressed="true"]{color:var(--ink);}
.mode-ico{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;border:1px solid currentColor;flex-shrink:0;}
.mode-btn[aria-pressed="true"] .mode-ico{color:var(--accent-l);border-color:var(--accent);}
.mode-ico svg{width:17px;height:17px;}
.mode-btn strong{display:block;font-family:var(--display);font-size:14px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;}
.mode-btn small{display:block;font-size:12.5px;font-style:italic;color:inherit;opacity:.85;line-height:1.2;}

.currency{position:relative;flex-shrink:0;}
.currency summary{
  list-style:none;display:flex;align-items:center;gap:8px;padding:8px 12px;border:1px solid var(--line);border-radius:8px;
  font-family:var(--display);font-size:11px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);cursor:pointer;user-select:none;
}
.currency summary::-webkit-details-marker{display:none;}
.currency summary:hover,.currency[open] summary{color:var(--gold-l);border-color:var(--line2);}
.coin-dot{width:12px;height:12px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#f3dc96,#a8862f);box-shadow:0 0 0 1px #5a4718;}
.cur-pop{
  position:absolute;right:0;top:calc(100% + 8px);width:250px;background:var(--panel);border:1px solid var(--line2);border-radius:var(--r);
  padding:12px 14px;box-shadow:0 14px 40px rgba(0,0,0,.55);z-index:50;
}
.cur-row{display:flex;justify-content:space-between;gap:10px;padding:5px 0;border-bottom:1px solid var(--line);font-size:14px;color:var(--muted);}
.cur-row:last-child{border-bottom:0;}
.cur-row b{font-family:var(--display);font-size:12px;font-weight:600;color:var(--gold-l);letter-spacing:.04em;}

/* ── Layout ────────────────────────────────── */
.layout{flex:1;min-height:0;display:grid;grid-template-columns:220px 360px minmax(0,1fr);}
.cats{border-right:1px solid var(--line);padding:18px 12px;display:flex;flex-direction:column;gap:2px;}
.side-label{font-family:var(--display);font-size:10px;font-weight:600;color:var(--gold-d);letter-spacing:.14em;text-transform:uppercase;padding:0 10px 10px;}
.cat{
  display:flex;justify-content:space-between;align-items:center;gap:8px;width:100%;padding:9px 12px;
  background:none;border:1px solid transparent;border-radius:8px;text-align:left;
  font-family:var(--display);font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);transition:background .15s,color .15s;
}
.cat:hover{background:var(--panel);color:var(--ink);}
.cat.active{background:var(--accent-soft);border-color:var(--accent-mid);color:var(--accent-l);}
.cat-n{font-family:var(--serif);font-size:12px;font-weight:400;letter-spacing:0;color:var(--faint);}
.cat.active .cat-n{color:var(--accent);}

.browser{border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0;}
.browser-head{padding:16px 18px 12px;border-bottom:1px solid var(--line);background:var(--bg);}
.browser-title{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px;}
.browser-title span:first-child{font-family:var(--display);font-size:13px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--gold-l);}
.browser-title span:last-child{font-size:13px;color:var(--faint);font-style:italic;}
.search{position:relative;}
.search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:16px;height:16px;color:var(--faint);pointer-events:none;}
.search input{
  width:100%;padding:10px 12px 10px 36px;border:1px solid var(--line2);border-radius:8px;background:var(--panel);
  font-size:16px;outline:none;-webkit-appearance:none;transition:border-color .15s;
}
.search input::placeholder{color:var(--faint);font-style:italic;}
.search input:focus{border-color:var(--accent);}
.sell-hint{margin-top:10px;font-size:13px;font-style:italic;color:var(--sell-l);display:none;}
body[data-mode="sell"] .sell-hint{display:block;}

.list{flex:1;overflow-y:auto;}
.row{
  display:flex;align-items:center;gap:12px;width:100%;padding:11px 18px;background:none;border:0;border-bottom:1px solid rgba(201,168,76,0.07);
  text-align:left;transition:background .12s;position:relative;
}
.row:hover{background:var(--panel);}
.row.sel{background:var(--accent-soft);}
.row.sel::before{content:'';position:absolute;left:0;top:6px;bottom:6px;width:3px;border-radius:0 3px 3px 0;background:var(--accent);}
.row-main{flex:1;min-width:0;}
.row-name{display:block;font-size:16px;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.row-meta:empty{display:none;}
.row-meta{display:flex;align-items:center;gap:6px;margin-top:2px;min-height:18px;}
.row-cat{font-family:var(--display);font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--faint);}
.row-price{text-align:right;flex-shrink:0;font-family:var(--display);font-size:13px;font-weight:600;color:var(--accent-l);}
.row-price small{display:block;font-family:var(--serif);font-size:11.5px;font-weight:400;font-style:italic;color:var(--faint);}
.empty-list{padding:28px 18px;text-align:center;color:var(--faint);font-style:italic;}

.rbadge{font-family:var(--display);font-size:9px;font-weight:600;padding:2px 8px;border-radius:20px;white-space:nowrap;letter-spacing:.05em;text-transform:uppercase;}
.rbadge.big{font-size:10.5px;padding:4px 11px;}
.r-common{background:#2a2a25;color:#b3b1a2;border:1px solid #4a4a40;}
.r-uncommon{background:#1a2a1a;color:#86c486;border:1px solid #3a6a3a;}
.r-rare{background:#1a1f2e;color:#8aa8e0;border:1px solid #3a4a7a;}
.r-very-rare{background:#251a35;color:#bb8ae4;border:1px solid #5a3a7a;}
.r-legendary{background:#2e2010;color:#dcab5c;border:1px solid #7a5020;}
.r-artifact{background:#2e1010;color:#e48a8a;border:1px solid #7a3030;}

/* ── Detail ────────────────────────────────── */
.detail{min-height:0;display:flex;flex-direction:column;}
.sheet-bar{display:none;}
.detail-scroll{flex:1;overflow-y:auto;padding:28px;}
.empty-state{height:100%;min-height:300px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:12px;color:var(--faint);padding:30px;}
.empty-state svg{width:54px;height:54px;color:var(--gold-d);}
.empty-state h2{font-family:var(--display);font-size:16px;font-weight:600;letter-spacing:.08em;color:var(--muted);}
.empty-state p{font-style:italic;max-width:340px;}
.notice{margin-top:6px;padding:10px 14px;border:1px solid rgba(181,40,40,.4);background:rgba(139,26,26,.15);border-radius:8px;color:#e8b0a8;font-style:italic;font-size:14px;}

.card{max-width:760px;margin:0 auto;}
.mode-banner{
  display:flex;align-items:center;gap:12px;padding:10px 14px;margin-bottom:18px;border-radius:var(--r);
  background:var(--accent-soft);border:1px solid var(--accent-mid);
}
.mode-banner .mode-ico{display:grid;place-items:center;color:var(--accent-l);border-color:var(--accent);width:36px;height:36px;flex-shrink:0;}
.mode-ico svg{display:block;}
.mode-banner strong{display:block;font-family:var(--display);font-size:12.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--accent-l);}
.mode-banner div>span{display:block;font-size:14px;color:var(--muted);font-style:italic;line-height:1.3;}

.eyebrow{font-family:var(--display);font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--faint);margin-bottom:4px;}
.title-row{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:16px;}
.title-row h2{font-family:var(--display);font-size:28px;font-weight:700;color:var(--gold-l);letter-spacing:.02em;line-height:1.15;}
.item-img{width:100%;max-height:300px;object-fit:contain;background:#0f0b08;border-radius:var(--r);border:1px solid var(--line);margin-bottom:18px;display:block;}

.top-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.6fr);gap:12px;margin-bottom:12px;}
.market{background:var(--panel);border:1px solid var(--line2);border-radius:var(--r);padding:14px 16px;position:relative;}
.label{font-family:var(--display);font-size:10px;font-weight:600;color:var(--faint);letter-spacing:.12em;text-transform:uppercase;margin-bottom:4px;}
.market-val{font-family:var(--display);font-size:26px;font-weight:700;color:var(--gold-l);line-height:1.1;}
.market-note{font-size:13.5px;color:var(--muted);font-style:italic;margin-top:2px;}
.stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px;align-content:start;}
.stat{background:var(--bg2);border:1px solid var(--line);border-radius:8px;padding:8px 11px;}
.stat-v{font-size:15px;color:var(--ink);line-height:1.3;}
.craft{background:var(--bg2);border:1px solid rgba(181,40,40,0.35);border-radius:var(--r);padding:11px 14px;margin-bottom:12px;}
.craft .label{color:#c9605a;}
.craft-row{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:14.5px;color:var(--muted);}
.craft-row b{font-weight:500;color:var(--ink);}

.section{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px;margin-top:18px;}
.section-h{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px;}
.section-h h3{font-family:var(--display);font-size:13px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--accent-l);}
.section-h span{font-size:13px;color:var(--faint);font-style:italic;}

.inputs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-bottom:14px;}
.inputs.three{grid-template-columns:repeat(3,minmax(0,1fr));}
.stepper{display:flex;border:1px solid var(--line2);border-radius:8px;overflow:hidden;background:var(--bg2);height:46px;}
.stepper:focus-within{border-color:var(--accent);}
.stepper button{width:46px;flex-shrink:0;background:var(--panel3);border:0;font-family:var(--display);font-size:20px;font-weight:700;color:var(--gold-l);user-select:none;transition:background .12s;}
.stepper button:hover{background:var(--accent-mid);}
.stepper button:active{background:var(--accent);color:var(--bg);}
.stepper input,.plain-input{flex:1;min-width:0;border:0;background:transparent;text-align:center;font-size:18px;font-family:var(--display);font-weight:600;outline:none;-webkit-appearance:none;-moz-appearance:textfield;}
.plain-input{width:100%;height:46px;border:1px solid var(--line2);border-radius:8px;background:var(--bg2);}
.plain-input:focus{border-color:var(--accent);}
input[type=number]::-webkit-inner-spin-button,input[type=number]::-webkit-outer-spin-button{-webkit-appearance:none;margin:0;}

.roll-line{display:grid;grid-template-columns:1fr 92px;gap:10px;align-items:stretch;}
.roll-btn{
  display:flex;align-items:center;justify-content:center;gap:10px;min-height:52px;padding:0 18px;
  background:linear-gradient(180deg,var(--accent-mid),var(--accent-soft));border:1px solid var(--accent);border-radius:10px;
  font-family:var(--display);font-size:14px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--accent-l);transition:transform .1s,filter .15s;
}
.roll-btn:hover{filter:brightness(1.15);}
.roll-btn:active{transform:scale(.98);}
.roll-btn:disabled{opacity:.4;cursor:not-allowed;filter:none;}
.dice{display:inline-flex;line-height:0;}
.manual{position:relative;}
.manual input{width:100%;height:100%;min-height:52px;border:1px solid var(--line2);border-radius:10px;background:var(--bg2);text-align:center;font-family:var(--display);font-size:22px;font-weight:700;color:var(--gold-l);outline:none;-moz-appearance:textfield;}
.manual input:focus{border-color:var(--accent);}
.manual span{position:absolute;top:-8px;left:50%;transform:translateX(-50%);background:var(--panel);padding:0 5px;font-family:var(--display);font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--faint);white-space:nowrap;}

.tier{display:none;align-items:center;justify-content:space-between;gap:12px;margin-top:14px;padding:12px 14px;border-radius:10px;border:1px solid;}
.tier.show{display:flex;}
.tier-name{font-family:var(--display);font-size:15px;font-weight:700;letter-spacing:.04em;}
.tier-desc{font-size:14px;font-style:italic;opacity:.85;margin-top:1px;}
.tier-mod{font-family:var(--display);font-size:18px;font-weight:700;white-space:nowrap;text-align:right;}

.outcome{
  margin-top:14px;padding:16px 18px;border-radius:12px;background:#0f0b08;border:1px solid var(--accent);
  display:flex;justify-content:space-between;align-items:center;gap:16px;position:relative;
}
.outcome::before,.outcome::after{content:'';position:absolute;width:9px;height:9px;border-color:var(--accent);border-style:solid;}
.outcome::before{top:5px;left:5px;border-width:1px 0 0 1px;}
.outcome::after{bottom:5px;right:5px;border-width:0 1px 1px 0;}
.out-label{font-family:var(--display);font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--accent-l);}
.out-sub{font-size:13.5px;color:var(--muted);font-style:italic;margin-top:3px;}
.out-val{font-family:var(--display);font-size:30px;font-weight:700;color:var(--ink);text-align:right;line-height:1.1;}
.out-diff{font-size:13.5px;text-align:right;margin-top:3px;font-style:italic;}
.breakdown{margin-top:10px;display:grid;gap:4px;font-size:14px;color:var(--muted);}
.breakdown div{display:flex;justify-content:space-between;gap:10px;border-bottom:1px dotted var(--line);padding:3px 2px;}
.breakdown b{font-weight:500;color:var(--ink);}

.ref{margin-top:14px;}
.ref summary{cursor:pointer;font-family:var(--display);font-size:11px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);padding:6px 0;list-style:none;display:flex;align-items:center;gap:8px;}
.ref summary::-webkit-details-marker{display:none;}
.ref summary::before{content:'▸';color:var(--accent);transition:transform .2s;}
.ref[open] summary::before{transform:rotate(90deg);}
.ref table{width:100%;border-collapse:collapse;margin-top:6px;font-size:14px;}
.ref td{padding:6px 8px;border-bottom:1px solid var(--line);}
.ref td:first-child{font-family:var(--display);font-size:12px;font-weight:600;white-space:nowrap;color:var(--muted);width:70px;}
.ref td:last-child{text-align:right;white-space:nowrap;font-family:var(--display);font-size:12.5px;}
.ref tr.on td{background:var(--accent-soft);}
.ref p{font-size:13px;color:var(--faint);font-style:italic;margin-top:8px;}

@keyframes dr{0%{transform:rotate(0) scale(1.3);}50%{transform:rotate(180deg) scale(.8);}100%{transform:rotate(360deg) scale(1);}}
.spin{animation:dr .45s ease-out;}
@keyframes pop{0%{transform:scale(.96);opacity:.4;}100%{transform:scale(1);opacity:1;}}
.pop{animation:pop .25s ease-out;}

/* ── Desktop: fixed-height panes ───────────── */
@media (min-width:760px){
  body{height:100vh;height:100dvh;overflow:hidden;}
  .layout>*{min-height:0;overflow-y:auto;}
  .browser{overflow:hidden;}
  .detail{overflow:hidden;}
}

/* ── Tablet / small laptop ─────────────────── */
@media (max-width:1099px) and (min-width:760px){
  .layout{grid-template-columns:330px minmax(0,1fr);grid-template-rows:auto minmax(0,1fr);}
  .cats{grid-column:1/-1;flex-direction:row;overflow-x:auto;overflow-y:hidden;border-right:0;border-bottom:1px solid var(--line);padding:10px 16px;gap:6px;}
  .side-label{display:none;}
  .cat{width:auto;flex-shrink:0;padding:7px 12px;border-color:var(--line);}
  .detail-scroll{padding:22px;}
  .mode-btn small{display:none;}
  .mode-toggle{width:min(340px,100%);}
}

/* ── Phone ─────────────────────────────────── */
@media (max-width:759px){
  .topbar{flex-wrap:wrap;gap:10px;padding:10px 14px;padding-top:max(10px,env(safe-area-inset-top));}
  .brand{flex:1;}
  .brand-mark{width:34px;height:34px;}
  .brand h1{font-size:17px;}
  .brand p{font-size:12px;}
  .mode-toggle{order:3;width:100%;}
  .mode-btn{padding:8px 10px;gap:8px;}
  .mode-ico{width:28px;height:28px;}
  .mode-btn strong{font-size:13px;}
  .mode-btn small{font-size:11.5px;}
  .currency summary{padding:7px 10px;}
  .layout{display:block;}
  .cats{flex-direction:row;overflow-x:auto;border-right:0;border-bottom:1px solid var(--line);padding:10px 14px;gap:6px;scrollbar-width:none;}
  .cats::-webkit-scrollbar{display:none;}
  .side-label{display:none;}
  .cat{width:auto;flex-shrink:0;padding:7px 12px;border-color:var(--line);font-size:11px;}
  .browser{border-right:0;}
  .browser-head{position:sticky;top:var(--hh);z-index:20;padding:12px 14px 10px;}
  .row{padding:12px 14px;min-height:58px;}
  .detail{
    position:fixed;left:0;right:0;bottom:0;top:var(--hh);z-index:35;background:var(--bg);
    transform:translateY(100%);transition:transform .3s cubic-bezier(.4,.1,.2,1);visibility:hidden;
  }
  .detail.open{transform:none;visibility:visible;}
  .sheet-bar{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 14px;border-bottom:1px solid var(--line);background:var(--bg2);}
  .back-btn{display:flex;align-items:center;gap:6px;background:none;border:0;font-family:var(--display);font-size:12px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--gold-l);padding:6px 0;}
  .sheet-mode{font-family:var(--display);font-size:10.5px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--accent-l);border:1px solid var(--accent);border-radius:20px;padding:3px 10px;}
  .detail-scroll{padding:16px 14px calc(28px + env(safe-area-inset-bottom));}
  .title-row h2{font-size:23px;}
  .top-grid{grid-template-columns:1fr;}
  .stats{grid-template-columns:repeat(2,minmax(0,1fr));}
  .section{padding:14px;}
  .inputs.three{grid-template-columns:repeat(2,minmax(0,1fr));}
  .inputs.three>:last-child{grid-column:1/-1;}
  .outcome{flex-direction:column;align-items:stretch;gap:8px;}
  .out-val,.out-diff{text-align:left;}
  .out-val{font-size:28px;}
  html.sheet-open,html.sheet-open body{overflow:hidden;}
  .empty-state{display:none;}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;}}

const TONE={

/*
  BUYING: the merchant sets the price. Reputation multiplies market value,
  so the party can pay above OR below market.
  Tier is decided by the TOTAL (d20 + CHA modifier, clamped 1 to 20).
*/
const BUY_TIERS=[
  {min:1, max:1, name:'Enemy',        desc:'They despise you',                 mult:4.00,tone:'bad3',  ml:'+300%'},
  {min:2, max:5, name:'Unfriendly',   desc:'Suspicion colours the deal',       mult:2.00,tone:'bad2',  ml:'+100%'},

  {min:16,max:19,name:'Trusted Ally', desc:'They would give you the world',    mult:0.75,tone:'great', ml:'-25%'},
  {min:20,max:20,name:'Adored',       desc:'Legends are told of your name',    mult:0.50,tone:'legend',ml:'-50%'},
];

/*
  SELLING: the merchant makes an offer. The party receives a share of market value,
  capped at 100%. Only a NATURAL 20 on the die (not a modified 20) beats market value.
*/
const SELL_TIERS=[
  {min:1, max:1, name:'Insulting offer',  desc:'They scoff at your wares',           mult:0.10,tone:'bad3', ml:'10%'},
  {min:2, max:5, name:'Lowball',          desc:'A miserly counter-offer',            mult:0.25,tone:'bad2', ml:'25%'},
  {min:6, max:10,name:'Standard resale',  desc:'The usual rate for second-hand goods',mult:0.50,tone:'mid',  ml:'50%'},
  {min:11,max:15,name:'Generous',         desc:'They see real worth in it',          mult:0.75,tone:'good', ml:'75%'},
  {min:16,max:20,name:'Full market value',desc:'They pay what it is worth',          mult:1.00,tone:'great',ml:'100%'},
];
const SELL_NAT20={nat:true,name:'Natural 20: Bidding war',desc:'They want it badly and pay over the odds',mult:1.10,tone:'legend',ml:'110%'};

function tiersFor(mode){return mode==='buy'?BUY_TIERS:SELL_TIERS;}
function getTier(mode,total,raw){
  if(mode==='sell'&&raw===20)return SELL_NAT20;
  const list=tiersFor(mode);
  return list.find(t=>total>=t.min&&total<=t.max)||list[2];
}

/*
  ALL prices are stored in copper pieces (cp). Conversion:
    10 cp  = 1 sp
    50 cp  = 1 ep
    100 cp = 1 gp
    1000 cp = 10 gp = 1 pp

  Decision: never auto-convert to pp in the calculator output. Always show gp for amounts >= 100 cp.
  Platinum is listed in the currency key for reference only. This matches how D&D merchants price things.
*/
function cpToDisplay(cp){
  if(cp===null||cp===undefined||cp===0)return'–';
  if(cp<0)cp=0;
  if(cp>=100){
    const gp=cp/100;
    return gp.toLocaleString('en-US',{minimumFractionDigits:0,maximumFractionDigits:2})+' gp';
  }
  if(cp>=50&&cp%50===0)return(cp/50)+' ep';
  if(cp>=10&&cp%10===0)return(cp/10)+' sp';
  return cp+' cp';
}
function fmt(cp){cp=Math.round(cp);return cp<=0?'0 cp':cpToDisplay(cp);}

function ing(name,rarity,cp){
  return{name,cost:cpToDisplay(cp),baseCost:cp,note:'',rarity,details:{Rarity:rarity,Type:'Ingredient',Use:'Alchemy / crafting'}};
}

/* ── Rules for what can be sold, and how quantity is labelled ── */
const UNSELLABLE_CATS=['Services','Tavern'];
function isSellable(item){return !UNSELLABLE_CATS.includes(item._cat)&&item.note!=='service';}
function isPriceless(item){return item.cost==='Priceless';}
function hasPrice(item){return item.baseCost!==null&&item.baseCost!==undefined;}
function qtyLabel(item){
  const n=(item.note||'').toLowerCase();
  if(n.includes('per day'))return'Days';
  if(n.includes('per mile'))return'Miles';
  return'Quantity';
}

const CATS=['All',...Object.keys(data)];
function itemsIn(cat){
  if(cat==='All'){const a=[];Object.entries(data).forEach(([c,items])=>items.forEach(i=>a.push({...i,_cat:c})));return a;}
  return (data[cat]||[]).map(i=>({...i,_cat:cat}));
}
function tradeable(items){return S.mode==='buy'?items:items.filter(isSellable);}

function badgeHtml(rarity,big){
  if(!rarity)return'';
  return'<span class="rbadge '+(RB[rarity]||'r-common')+(big?' big':'')+'">'+rarity+'</span>';
}
const DICE_SVG='<svg viewBox="0 0 100 100" width="24" height="24"><polygon points="32,38 68,38 50,5" fill="#e8cd7e"/><polygon points="32,38 50,5 11,27" fill="#b89a40"/><polygon points="68,38 50,5 89,27" fill="#c9a84c"/><polygon points="32,38 68,38 50,72" fill="#d4b560"/><polygon points="32,38 50,72 11,72" fill="#96802e"/><polygon points="68,38 50,72 89,72" fill="#a89038"/><polygon points="32,38 11,72 11,27" fill="#7a6628"/><polygon points="68,38 89,72 89,27" fill="#8a7530"/><polygon points="50,72 11,72 50,95" fill="#6a5820"/><polygon points="50,72 89,72 50,95" fill="#7a6628"/></svg>';
const BUY_ICON=document.querySelector('.mode-btn[data-mode="buy"] .mode-ico').innerHTML;
const SELL_ICON=document.querySelector('.mode-btn[data-mode="sell"] .mode-ico').innerHTML;

/* ── State ── */
const S={mode:'buy',cat:'All',q:'',item:null,qty:1,cha:0,raw:null,customGp:'',notice:''};

const el=id=>document.getElementById(id);
const catsEl=el('cats'),listEl=el('list'),searchEl=el('search'),detailEl=el('detail'),scrollEl=el('detailScroll');
const narrow=()=>window.matchMedia('(max-width:759px)').matches;

/* Keep the sticky offsets in step with the real header height */
function syncHeader(){document.documentElement.style.setProperty('--hh',el('topbar').offsetHeight+'px');}
new ResizeObserver(syncHeader).observe(el('topbar'));
syncHeader();

/* ── Categories ── */
function renderCats(){
  const visible=CATS.filter(c=>tradeable(itemsIn(c)).length>0);
  if(!visible.includes(S.cat))S.cat='All';
  catsEl.innerHTML='<div class="side-label">Categories</div>'+visible.map(c=>{
    const n=tradeable(itemsIn(c)).length;
    return'<button type="button" class="cat'+(c===S.cat?' active':'')+'" data-cat="'+c+'"><span>'+(c==='All'?'All wares':c)+'</span><span class="cat-n">'+n+'</span></button>';
  }).join('');
}
catsEl.addEventListener('click',e=>{
  const b=e.target.closest('.cat');if(!b)return;
  S.cat=b.dataset.cat;S.q='';searchEl.value='';
  searchEl.placeholder=S.cat==='All'?"Search the merchant's wares...":'Search '+S.cat.toLowerCase()+'...';
  renderCats();renderList();
  b.blur();
  const active=catsEl.querySelector('.cat.active');if(active)active.scrollIntoView({block:'nearest',inline:'center'});
});

/* ── List ── */
let shown=[];
function renderList(){
  el('catLabel').textContent=S.cat==='All'?'All wares':S.cat;
  const q=S.q.trim().toLowerCase();
  shown=tradeable(itemsIn(S.cat)).filter(i=>!q||i.name.toLowerCase().includes(q));
  el('count').textContent=shown.length+(shown.length===1?' item':' items');
  if(!shown.length){listEl.innerHTML='<div class="empty-list">Nothing on the shelves matches that.</div>';return;}
  listEl.innerHTML=shown.map((it,i)=>{
    const sel=S.item&&S.item._cat===it._cat&&S.item.name===it.name;
    const cat=S.cat==='All'?'<span class="row-cat">'+it._cat+'</span>':'';
    return'<button type="button" class="row'+(sel?' sel':'')+'" data-i="'+i+'">'+
      '<span class="row-main"><span class="row-name">'+it.name+'</span><span class="row-meta">'+cat+badgeHtml(it.rarity,false)+'</span></span>'+
      '<span class="row-price">'+it.cost+(it.note?'<small>'+it.note+'</small>':'')+'</span></button>';
  }).join('');
}
listEl.addEventListener('click',e=>{
  const r=e.target.closest('.row');if(!r)return;
  selectItem(shown[+r.dataset.i]);
});
searchEl.addEventListener('input',()=>{S.q=searchEl.value;renderList();});

function selectItem(item){
  S.item=item;S.qty=1;S.raw=null;S.customGp='';S.notice='';
  listEl.querySelectorAll('.row').forEach(r=>r.classList.toggle('sel',shown[+r.dataset.i]===item));
  renderDetail();
  scrollEl.scrollTop=0;
  if(narrow())openSheet();
}

/* ── Mobile sheet ── */
function openSheet(){detailEl.classList.add('open');document.documentElement.classList.add('sheet-open');}
function closeSheet(){detailEl.classList.remove('open');document.documentElement.classList.remove('sheet-open');}
el('closeSheet').addEventListener('click',closeSheet);
document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeSheet();el('currency').open=false;}});
document.addEventListener('click',e=>{if(!e.target.closest('#currency'))el('currency').open=false;});

/* ── Detail ── */
function renderDetail(){
  const buy=S.mode==='buy';
  el('sheetMode').textContent=buy?'Buying':'Selling';
  const it=S.item;
  if(!it){
    scrollEl.innerHTML='<div class="empty-state"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5V5a2 2 0 0 1 2-2h12v16H6a2 2 0 0 0-2 2z"/><path d="M8 7h6M8 11h6"/></svg>'+
      '<h2>'+(buy?'What are they buying?':'What are you selling?')+'</h2>'+
      '<p>Pick an item from the ledger to see its market value and haggle a price.</p>'+
      (S.notice?'<div class="notice">'+S.notice+'</div>':'')+'</div>';
    return;
  }
  const details=Object.entries(it.details||{}).filter(([k])=>k!=='Rarity');
  const stats=details.map(([k,v])=>'<div class="stat"><div class="label">'+k+'</div><div class="stat-v">'+v+'</div></div>').join('');

  /* Crafting rules only make sense for magic items. Ingredients are materials, not crafted goods. */
  let craft='';
  if(it._cat==='Magic Items'&&!isPriceless(it)){
    if(CRAFT[it.rarity]){
      const c=CRAFT[it.rarity];
      craft='<div class="craft"><div class="label">⚗ Crafting, DMG rules</div><div class="craft-row"><span>Time: <b>'+c.days+' days</b></span><span>Materials: <b>'+c.cost+'</b></span><span>Needs: <b>Arcana proficiency</b></span></div></div>';
    }else if(it.rarity==='Artifact'){
      craft='<div class="craft"><div class="label">⚗ Crafting</div><div class="craft-row"><span>Artifacts cannot be crafted. They are ancient and unique.</span></div></div>';
    }
  }

  const priced=hasPrice(it);
  const needsBase=!priced&&!isPriceless(it);
  const ql=qtyLabel(it);

  scrollEl.innerHTML=
  '<article class="card">'+
    '<div class="mode-banner"><span class="mode-ico">'+(buy?BUY_ICON:SELL_ICON)+'</span><div>'+
      '<strong>'+(buy?'Buying from the merchant':'Selling to the merchant')+'</strong>'+
      '<span>'+(buy?'The merchant names the price. Reputation can push it above or below market value.':'The merchant makes an offer. The best you can expect is market value, and only a natural 20 beats it.')+'</span>'+
    '</div></div>'+
    '<div class="eyebrow">✦ '+it._cat+' ✦</div>'+
    '<div class="title-row"><h2>'+it.name+'</h2>'+badgeHtml(it.rarity,true)+'</div>'+
    (it.img?'<img src="'+it.img+'" alt="'+it.name.replace(/"/g,'&quot;')+'" class="item-img" onerror="this.style.display=\'none\'">':'')+
    '<div class="top-grid'+(stats?'':'" style="grid-template-columns:1fr')+'">'+
      '<div class="market"><div class="label">Market value</div><div class="market-val">'+it.cost+'</div>'+(it.note?'<div class="market-note">'+it.note+'</div>':'')+'</div>'+
      (stats?'<div class="stats">'+stats+'</div>':'')+
    '</div>'+
    craft+
    '<div class="section">'+
      '<div class="section-h"><h3>'+(buy?'Haggle the price':'Haggle the offer')+'</h3><span>d20 + Charisma</span></div>'+
      '<div class="inputs'+(needsBase?' three':'')+'">'+
        (needsBase?'<div><div class="label">Agreed base price (gp)</div><input type="number" class="plain-input" id="baseGp" min="0" step="0.01" inputmode="decimal" placeholder="Set by DM" value="'+S.customGp+'"></div>':'')+
        '<div><div class="label">'+ql+'</div><div class="stepper"><button type="button" data-step="qty" data-d="-1" aria-label="Decrease">−</button><input type="number" id="qty" value="'+S.qty+'" min="1" inputmode="numeric"><button type="button" data-step="qty" data-d="1" aria-label="Increase">+</button></div></div>'+
        '<div><div class="label">Charisma modifier</div><div class="stepper"><button type="button" data-step="cha" data-d="-1" aria-label="Decrease">−</button><input type="number" id="cha" value="'+S.cha+'" min="-5" max="10" inputmode="numeric"><button type="button" data-step="cha" data-d="1" aria-label="Increase">+</button></div></div>'+
      '</div>'+
      '<div class="roll-line">'+
        '<button type="button" class="roll-btn" id="rollBtn"'+(isPriceless(it)?' disabled':'')+'><span class="dice" id="dice">'+DICE_SVG+'</span>Roll d20</button>'+
        '<label class="manual"><span>or enter roll</span><input type="number" id="manual" min="1" max="20" placeholder="–" inputmode="numeric" value="'+(S.raw??'')+'"'+(isPriceless(it)?' disabled':'')+'></label>'+
      '</div>'+
      '<div class="tier" id="tier"><div><div class="tier-name" id="tierName"></div><div class="tier-desc" id="tierDesc"></div></div><div class="tier-mod" id="tierMod"></div></div>'+
      '<div class="outcome" id="outcome"><div><div class="out-label" id="outLabel"></div><div class="out-sub" id="outSub"></div></div><div><div class="out-val" id="outVal">–</div><div class="out-diff" id="outDiff"></div></div></div>'+
      '<div class="breakdown" id="breakdown"></div>'+
      '<details class="ref"><summary>'+(buy?'Buying':'Selling')+' reputation table</summary><table id="refTable"></table>'+
        '<p>'+(buy?'Total = d20 + Charisma modifier, capped between 1 and 20.':'Total = d20 + Charisma modifier, capped between 1 and 20. A modified 20 earns full value. Only a natural 20 on the die earns more.')+'</p></details>'+
    '</div>'+
  '</article>';

  wireDetail();
  updateCalc();
}

function wireDetail(){
  const qty=el('qty'),cha=el('cha'),manual=el('manual'),base=el('baseGp');
  scrollEl.querySelectorAll('[data-step]').forEach(b=>b.addEventListener('click',()=>{
    const d=+b.dataset.d;
    if(b.dataset.step==='qty'){S.qty=Math.max(1,(parseInt(qty.value)||1)+d);qty.value=S.qty;}
    else{S.cha=Math.max(-5,Math.min(10,(parseInt(cha.value)||0)+d));cha.value=S.cha;}
    updateCalc();
  }));
  qty.addEventListener('input',()=>{S.qty=Math.max(1,parseInt(qty.value)||1);updateCalc();});
  cha.addEventListener('input',()=>{S.cha=Math.max(-5,Math.min(10,parseInt(cha.value)||0));updateCalc();});
  manual.addEventListener('input',()=>{
    const v=parseInt(manual.value);
    S.raw=(v>=1&&v<=20)?v:null;
    updateCalc(true);
  });
  if(base)base.addEventListener('input',()=>{S.customGp=base.value;updateCalc();});
  el('rollBtn').addEventListener('click',()=>{
    const raw=Math.ceil(Math.random()*20);
    const d=el('dice');d.classList.remove('spin');void d.offsetWidth;d.classList.add('spin');
    manual.value=raw;S.raw=raw;updateCalc(true);
  });
}

function updateCalc(animate){
  const it=S.item;if(!it)return;
  const buy=S.mode==='buy';
  const outLabel=el('outLabel'),outSub=el('outSub'),outVal=el('outVal'),outDiff=el('outDiff'),bd=el('breakdown'),tierEl=el('tier');

  let total=null,tier=null;
  if(S.raw!==null){
    total=Math.max(1,Math.min(20,S.raw+S.cha));
    tier=getTier(S.mode,total,S.raw);
  }

  /* Tier banner */
  if(tier){
    const t=TONE[tier.tone];
    tierEl.classList.add('show');
    tierEl.style.background=t.bg;tierEl.style.borderColor=t.c+'55';
    el('tierName').textContent=tier.name;el('tierName').style.color=t.c;
    const chaTxt=S.cha!==0?' '+(S.cha>0?'+ ':'− ')+Math.abs(S.cha)+' CHA = '+total:'';
    el('tierDesc').textContent='Rolled '+S.raw+chaTxt+'. '+tier.desc+'.';
    el('tierMod').textContent=buy?tier.ml:tier.ml+' of market';el('tierMod').style.color=t.c;
    if(animate){tierEl.classList.remove('pop');void tierEl.offsetWidth;tierEl.classList.add('pop');}
  }else tierEl.classList.remove('show');

  /* Reference table */
  const rows=tiersFor(S.mode).map(t=>({range:t.min===t.max?String(t.min):t.min+'–'+t.max,t}));
  if(!buy)rows.push({range:'Nat 20',t:SELL_NAT20});
  el('refTable').innerHTML=rows.map(r=>'<tr class="'+(tier===r.t?'on':'')+'"><td>'+r.range+'</td><td style="color:'+TONE[r.t.tone].c+'">'+r.t.name+'</td><td style="color:'+TONE[r.t.tone].c+'">'+(buy?r.t.ml:r.t.ml+' of market')+'</td></tr>').join('');

  /* Priceless items */
  if(isPriceless(it)){
    outLabel.textContent=buy?'Price':'Offer';
    outSub.textContent=buy?'No merchant can name a price for this.':'No merchant could afford this.';
    outVal.textContent='Priceless';outDiff.textContent='';bd.innerHTML='';
    return;
  }

  let unit=hasPrice(it)?it.baseCost:null;
  if(unit===null&&S.customGp!==''&&!isNaN(parseFloat(S.customGp)))unit=Math.round(parseFloat(S.customGp)*100);
  if(unit===null){
    outLabel.textContent='Awaiting a base price';
    outSub.textContent='The listed price is '+it.cost+'. Enter the agreed base price to haggle.';
    outVal.textContent='–';outDiff.textContent='';bd.innerHTML='';
    return;
  }

  const market=unit*S.qty;
  const qtyLine=S.qty>1?'<div><span>Market value ('+S.qty+' × '+fmt(unit)+')</span><b>'+fmt(market)+'</b></div>':'<div><span>Market value</span><b>'+fmt(market)+'</b></div>';

  if(!tier){
    outLabel.textContent='Market value';
    outSub.textContent=buy?'Roll to see what the merchant charges.':'Roll to see what the merchant offers.';
    outVal.textContent=fmt(market);outDiff.textContent='';
    bd.innerHTML=S.qty>1?qtyLine:'';
    return;
  }

  const final=Math.round(market*tier.mult);
  const diff=final-market;
  outLabel.textContent=buy?'Party pays':'Merchant pays the party';
  outSub.textContent=tier.name;
  outVal.textContent=fmt(final);
  if(animate){outVal.classList.remove('pop');void outVal.offsetWidth;outVal.classList.add('pop');}

  /* Green means good for the party: paying less when buying, receiving more when selling */
  const goodForParty=buy?diff<0:diff>0;
  if(diff===0){outDiff.textContent='Exactly market value';outDiff.style.color='var(--muted)';}
  else{
    outDiff.textContent=(diff>0?'+':'−')+fmt(Math.abs(diff))+(diff>0?' above':' below')+' market';
    outDiff.style.color=goodForParty?TONE.good.c:TONE.bad3.c;
  }
  bd.innerHTML=qtyLine+
    '<div><span>'+(buy?'Reputation adjustment':'Share of market value')+'</span><b>'+(buy?tier.ml:tier.ml)+'</b></div>'+
    '<div><span>'+(buy?'Final price':'Final offer')+'</span><b>'+fmt(final)+'</b></div>';
}

/* ── Mode toggle ── */
function setMode(mode){
  if(mode===S.mode)return;
  S.mode=mode;document.body.dataset.mode=mode;
  document.querySelectorAll('.mode-btn').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.mode===mode)));
  S.notice='';
  if(mode==='sell'&&S.item&&!isSellable(S.item)){
    S.notice=S.item.name+' cannot be sold back to a merchant, so it has been cleared.';
    S.item=null;S.raw=null;closeSheet();
  }
  renderCats();renderList();renderDetail();
}
document.querySelectorAll('.mode-btn').forEach(b=>b.addEventListener('click',()=>setMode(b.dataset.mode)));

/* ── Boot ── */
renderCats();renderList();renderDetail();
</script>
</body>
</html>
